name: egm

# EGM checks for pull requests (handbook/ux.md). The gate is free. The Goldfish review runs
# only with the label `egm-review` and the secret ANTHROPIC_API_KEY.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  gate:
    uses: ./.github/workflows/egm-gate.yml
    with:
      paths: '^(README\.md|_layouts/|assets/|learn/|faq\.md|glossary\.md|governance\.md|\.github/ISSUE_TEMPLATE/)'
  goldfish:
    if: github.event.action == 'labeled' && github.event.label.name == 'egm-review'
    uses: ./.github/workflows/egm-goldfish.yml
    secrets: inherit
