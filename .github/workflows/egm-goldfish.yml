name: egm-goldfish

# Reusable. Runs one EGM Goldfish review round (EGM reviewers + BuddhistAI personas) on the
# design documents in a pull request, and posts the findings as a comment. Read-only: it
# never edits files. Runs only when the pull request has the label `egm-review`.
# Needs the secret ANTHROPIC_API_KEY (org secret, or passed with `secrets: inherit`).
# Without it, the job says so and stops. Rules: handbook/ux.md in BuddhistAI/knowledge-base.
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check the key
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "ANTHROPIC_API_KEY is not set: skipping the Goldfish review."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 0
      - name: Get personas, journeys and standard
        if: steps.key.outputs.ok == 'true'
        run: |
          if [ "${{ github.repository }}" != "BuddhistAI/knowledge-base" ]; then
            git clone --depth 1 https://github.com/BuddhistAI/knowledge-base.git /tmp/kb
            mkdir -p .egm-context .claude/skills
            cp -r /tmp/kb/ux .egm-context/ux
            cp -rn /tmp/kb/.claude/skills/. .claude/skills/
          fi
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/google/elephant-goldfish-model.git
          plugins: egm@egm
          claude_args: --max-turns 60
          prompt: |
            Repository: ${{ github.repository }}. Pull request: #${{ github.event.pull_request.number }}.
            Find the EGM design documents this pull request adds or changes (docs/designs/*.md, not README, SITEMAP or TEMPLATE),
            or the design linked in its description. If there is none, post one comment saying so and stop.
            For each design, follow the buddhistai-ux-review skill in .claude/skills/buddhistai-ux-review/SKILL.md.
            Persona, journey and standard files are in ux/ (knowledge-base) or .egm-context/ux/ (other repos).
            This is a CI run: run ONE review round only, do not apply fixes, do not edit or commit any file.
            Then post ONE pull request comment with: the reviewers that ran, and the findings grouped by
            severity (Blocker, Major, Nit), each with where and why, in plain English. End the comment with:
            "Generated by an EGM Goldfish review (BuddhistAI personas). A person decides what to fix."
