# Buddhist AI projects. One entry per project. Rendered into directory/README.md by scripts/build.py.
# Fields:
#   name, url, org        who made it and where to find it
#   kind                  one of the project kinds in scripts/check.py
#   what                  one or two plain sentences: what it does
#   languages             language names, or [any]
#   open                  how open it is: license of code, data or models, or "free to use, closed source"
#   updated               last activity we saw (YYYY-MM), or "" if we could not tell
#   tasks                 knowledge-base task ids it helps with (optional)
# Keep entries neutral: describe, do not rank. Add a new entry at the end of its kind.

# Translation and dictionaries
- name: Dharmamitra
  url: https://dharmamitra.org/
  org: Dharmamitra team (UC Berkeley and partners)
  kind: Translation and dictionaries
  what: Machine translation, grammar analysis and search for Buddhist source languages. Its MITRA models are published on Hugging Face.
  languages: [Sanskrit, Tibetan, Classical Chinese, Pali, English]
  open: free web app; many models open (Hugging Face buddhist-nlp)
  updated: 2026-11
  tasks: [translation, text-translation-alignment]
- name: 84000
  url: https://84000.co/
  org: 84000
  kind: Translation and dictionaries
  what: Translates the Tibetan Buddhist canon (Kangyur and Tengyur) into English. Publishes its TEI files and translation memory on GitHub, and a public position on AI translation of canonical texts.
  languages: [Tibetan, English]
  open: free to read; data on GitHub (license not stated)
  updated: 2026-10
  tasks: [translation, text-translation-alignment]
- name: Monlam AI
  url: https://monlam.ai/
  org: Monlam
  kind: Translation and dictionaries
  what: Tibetan AI tools in one web app - translation, speech to text, text to speech and OCR.
  languages: [Tibetan, English]
  open: free to use; web app code open (MIT)
  updated: 2026-09
  tasks: [translation, ocr]
- name: Digital Pāḷi Dictionary
  url: https://www.dpdict.net/
  org: Digital Pāḷi Dictionary team
  kind: Translation and dictionaries
  what: Pali to English dictionary with grammar data and a compound splitter. The full database is on GitHub.
  languages: [Pali, English]
  open: open data on GitHub (see repo for license)
  updated: 2026-11
  tasks: [segmentation, term-extraction]
- name: Dharmamitra dictionaries and lexicon
  url: https://github.com/dharmamitra/dharmamitra-stardict-dictionaries
  org: Dharmamitra team
  kind: Translation and dictionaries
  what: StarDict dictionaries and a lexicon built from Dharmamitra's parallel text collection.
  languages: [Sanskrit, Tibetan, Classical Chinese, English]
  open: open on GitHub (license not stated)
  updated: 2026-11
  tasks: [term-extraction]
- name: Buddhist AI Translator (慧译通)
  url: https://github.com/xr843/Buddhist-AI-Translator
  org: xr843 (community)
  kind: Translation and dictionaries
  what: AI translator for Buddhist texts with support for Sanskrit, Pali and Tibetan terms.
  languages: [Chinese, Sanskrit, Pali, Tibetan, English]
  open: open source (MIT)
  updated: 2026-08
  tasks: [translation]

# Text libraries and search
- name: BDRC - Buddhist Digital Resource Center
  url: https://www.bdrc.io/
  org: BDRC
  kind: Text libraries and search
  what: The largest digital library of Tibetan texts (scans, e-texts and catalog). In 2026 it started an initiative to build open Buddhist datasets for AI, and it publishes OCR models and datasets on Hugging Face.
  languages: [Tibetan, Sanskrit, Chinese, Pali]
  open: free library; many datasets CC0
  updated: 2026-11
  tasks: [ocr, entity-extraction]
- name: OpenPecha
  url: https://openpecha.org/
  org: OpenPecha (WeBuddhist)
  kind: Text libraries and search
  what: Open Tibetan texts and the tools and datasets to work with them (OCR, speech, translation, outlines). Datasets and models are on Hugging Face.
  languages: [Tibetan, English]
  open: open data and code (licenses vary)
  updated: 2026-08
  tasks: [ocr, toc-extraction, translation]
- name: WeBuddhist app
