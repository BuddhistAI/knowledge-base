# Buddhist AI projects. One entry per project. Rendered into directory/README.md by scripts/build.py.
# Fields:
#   name, url, org        who made it and where to find it
#   kind                  one of the project kinds in scripts/check.py
#   what                  one or two plain sentences: what it does
#   languages             language names, or [any]
#   open                  how open it is: license of code, data or models, or "free to use, closed source"
#   updated               last activity we saw (YYYY-MM), or "" if we could not tell
#   tasks                 knowledge-base task ids it helps with (optional)
# Keep entries neutral: describe, do not rank. Add a new entry at the end of its kind.

# Translation and dictionaries
- name: Dharmamitra
  url: https://dharmamitra.org/
  org: Dharmamitra team (UC Berkeley and partners)
  kind: Translation and dictionaries
  what: Machine translation, grammar analysis and search for Buddhist source languages. Its MITRA models are published on Hugging Face.
  languages: [Sanskrit, Tibetan, Classical Chinese, Pali, English]
  open: free web app; many models open (Hugging Face buddhist-nlp)
  updated: 2026-11
  tasks: [translation, text-translation-alignment]
- name: 84000
  url: https://84000.co/
  org: 84000
  kind: Translation and dictionaries
  what: Translates the Tibetan Buddhist canon (Kangyur and Tengyur) into English. Publishes its TEI files and translation memory on GitHub, and a public position on AI translation of canonical texts.
  languages: [Tibetan, English]
  open: free to read; data on GitHub (license not stated)
  updated: 2026-10
  tasks: [translation, text-translation-alignment]
- name: Monlam AI
