title: BuddhistAI Wiki
description: The shared reference for Buddhist tasks, and the workflows they come from.
repository: BuddhistAI/wiki
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: {path: ""}
    values: {layout: default}
exclude: [scripts, templates, CLAUDE.md, AGENTS.md]
include: [CONTRIBUTING.md]
