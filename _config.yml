title: BuddhistAI Knowledge base
description: What each Buddhist task is, how projects do their work, and what our experiments found.
repository: BuddhistAI/knowledge-base
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: {path: ""}
    values: {layout: default}
exclude: [scripts, templates, CLAUDE.md, AGENTS.md, .egm-context]
include: [CONTRIBUTING.md]
