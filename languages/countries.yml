# East Asia

- name: China (mainland)
  region: East Asia
  buddhists: "about 4%, 53 million (2020)"
  traditions: Mahayana (Chan, Pure Land, Tiantai, Huayan)
  languages: [classical-chinese, chinese]
  source: https://www.pewresearch.org/religion/2025/06/09/buddhist-population-change/

- name: Taiwan
  region: East Asia
  buddhists: "about a quarter of adults (2023 survey)"
  traditions: Mahayana (Pure Land, Chan, humanistic Buddhism)
  languages: [classical-chinese, chinese]
  source: https://www.pewresearch.org/short-reads/2024/07/29/4-facts-about-religion-and-diversity-in-taiwan/

- name: Hong Kong
  region: East Asia
  buddhists: "more than 1 million followers (2016 government fact sheet)"
  traditions: Mahayana (Chan, Pure Land)
  languages: [classical-chinese, chinese]
  source: https://www.cstb.gov.hk/file_manager/en/documents/consultation-and-publications/hong_kong_fact_sheets.pdf

- name: Japan
  region: East Asia
  buddhists: "about 37% (2020, Pew estimate as reported by Wikipedia)"
  traditions: Mahayana (Pure Land, Zen, Nichiren, Shingon, Tendai)
  languages: [classical-chinese, japanese]
  source: https://en.wikipedia.org/wiki/Buddhism_by_country

- name: South Korea
  region: East Asia
  buddhists: "about 19% (2020)"
  traditions: Mahayana (Seon/Zen, mainly the Jogye Order)
  languages: [classical-chinese, korean]
  source: https://www.pewresearch.org/religion/2025/06/09/buddhist-population-change/

