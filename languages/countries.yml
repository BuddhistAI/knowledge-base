# Culturally Buddhist countries and regions.
# Each "buddhists" figure comes from the "source" URL on the same item.
# "not verified" means we found no reliable figure.
# Figures use different methods (census, survey, estimate). Do not compare them as one series.

# South Asia and the Himalayas

- name: Bhutan
  region: South Asia and the Himalayas
  buddhists: "about 75% (2020)"
  traditions: Vajrayana (Drukpa Kagyu, Nyingma)
  languages: [tibetan, dzongkha, himalayan-tibetic]
  source: https://www.pewresearch.org/religion/2025/06/09/buddhist-population-change/

- name: Tibet (Tibet Autonomous Region and Tibetan areas of China)
  region: South Asia and the Himalayas
  buddhists: not verified
  traditions: Vajrayana (Gelug, Kagyu, Nyingma, Sakya)
  languages: [tibetan, sanskrit, chinese]
  source: https://en.wikipedia.org/wiki/Buddhism_by_country

- name: Tibetan diaspora (India and Nepal)
  region: South Asia and the Himalayas
  buddhists: "about 94,200 Tibetans in India and 13,500 in Nepal (2009 survey of Tibetans in exile; counts people, not religion)"
  traditions: Vajrayana (Gelug, Kagyu, Nyingma, Sakya)
  languages: [tibetan, sanskrit]
  source: https://en.wikipedia.org/wiki/Tibetan_diaspora

- name: Ladakh and Himalayan India
  region: South Asia and the Himalayas
  buddhists: "about 66% in Leh district, Ladakh (2011 census)"
  traditions: Vajrayana (Drikung Kagyu, Drukpa Kagyu, Gelug; Nyingma and Karma Kagyu in Sikkim)
  languages: [tibetan, himalayan-tibetic, nepali]
  source: https://www.census2011.co.in/data/religion/district/621-leh.html

- name: Nepal
  region: South Asia and the Himalayas
  buddhists: "8.2%, about 2.39 million (2021 census)"
  traditions: Vajrayana (Tibetan schools and Newar Buddhism); Theravada revival
  languages: [sanskrit, tibetan, pali, nepali, newari, himalayan-tibetic]
  source: https://theprint.in/world/nepals-81-19-per-cent-population-is-hindu-even-as-followers-of-hinduism-buddhism-decline-and-islam-christians-increase/1611622

- name: Sri Lanka
  region: South Asia and the Himalayas
  buddhists: "about 70% (2020)"
  traditions: Theravada
  languages: [pali, sinhala]
  source: https://www.pewresearch.org/religion/2025/06/09/buddhist-population-change/

