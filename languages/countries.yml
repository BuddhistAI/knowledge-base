- name: Laos
  region: Mainland Southeast Asia
  buddhists: "about 64% (2020)"
  traditions: Theravada
  languages: [pali, lao]
  source: https://www.pewresearch.org/religion/2025/06/09/buddhist-population-change/

- name: Cambodia
  region: Mainland Southeast Asia
  buddhists: "about 97% (2020)"
  traditions: Theravada
  languages: [pali, khmer]
  source: https://www.pewresearch.org/religion/2025/06/09/buddhist-population-change/

- name: Vietnam
  region: Mainland Southeast Asia
  buddhists: "about 23% (2020, Pew estimate as reported by Wikipedia)"
  traditions: Mahayana (Thien/Zen, Pure Land); Theravada among Khmer Krom
