# Other countries with large Buddhist communities

- name: Singapore
  region: Other countries with large Buddhist communities
  buddhists: "31.1% of residents aged 15 and over (2020 census)"
  traditions: Mahayana (Chinese schools); also Theravada and Vajrayana
  languages: [classical-chinese, pali, chinese]
  source: https://www.singstat.gov.sg/-/media/files/publications/cop2020/sr1/executive-summary.pdf

- name: Malaysia
  region: Other countries with large Buddhist communities
  buddhists: "18.7% (2020 census)"
  traditions: Mahayana (Chinese schools); also Theravada and Vajrayana
  languages: [classical-chinese, pali, chinese]
  source: https://www.sinardaily.my/ampArticle/171461

- name: India (overall)
  region: Other countries with large Buddhist communities
  buddhists: "about 10 million, less than 1% (2020)"
  traditions: Navayana (Ambedkarite Buddhism, mainly in Maharashtra); Vajrayana in the Himalayas; Theravada
  languages: [pali, sanskrit, tibetan]
  source: https://www.pewresearch.org/religion/2025/06/09/buddhist-population-change/
